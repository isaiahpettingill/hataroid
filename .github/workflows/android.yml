name: Android APK
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '13 9 1 * *'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle :Hataroid:assembleDebug -PandroidCompileSdk=36 --no-daemon --stacktrace
      - name: Check arm64 library
        run: unzip -l Projects/Hataroid/build/outputs/apk/debug/Hataroid-debug.apk 'lib/arm64-v8a/libhataroid.so' | grep 'libhataroid.so'
      - uses: actions/upload-artifact@v4
        with:
          name: hataroid-debug
          path: Projects/Hataroid/build/outputs/apk/debug/Hataroid-debug.apk
      - name: Build signed release
        env:
          HATAROID_KEYSTORE_B64: ${{ secrets.HATAROID_KEYSTORE_B64 }}
          HATAROID_STORE_PASSWORD: ${{ github.event_name == 'pull_request' && 'temporary-ci-password' || secrets.HATAROID_STORE_PASSWORD }}
          HATAROID_KEY_ALIAS: ${{ github.event_name == 'pull_request' && 'ci-only' || secrets.HATAROID_KEY_ALIAS }}
          HATAROID_KEY_PASSWORD: ${{ github.event_name == 'pull_request' && 'temporary-ci-password' || secrets.HATAROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          export HATAROID_KEYSTORE="$RUNNER_TEMP/hataroid-release.p12"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$HATAROID_KEYSTORE" -alias "$HATAROID_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=CI only' -storepass "$HATAROID_STORE_PASSWORD" -keypass "$HATAROID_KEY_PASSWORD"
          else
            if [[ -z "$HATAROID_KEYSTORE_B64" || -z "$HATAROID_STORE_PASSWORD" || -z "$HATAROID_KEY_ALIAS" || -z "$HATAROID_KEY_PASSWORD" ]]; then
              echo 'Set the HATAROID_* signing secrets with scripts/setup-signing.sh.' >&2
              exit 1
            fi
            printf '%s' "$HATAROID_KEYSTORE_B64" | base64 --decode > "$HATAROID_KEYSTORE"
          fi
          gradle :Hataroid:assembleRelease -PandroidCompileSdk=36 --no-daemon
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Projects/Hataroid/build/outputs/apk/release/Hataroid-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 Projects/Hataroid/build/outputs/apk/release/Hataroid-release.apk
      - name: Allow emulator hardware acceleration
        if: github.event_name == 'pull_request'
        run: sudo chmod a+rw /dev/kvm
      - name: Launch on Android emulator
        if: github.event_name == 'pull_request'
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          emulator-boot-timeout: 180
          script: |
            adb install Projects/Hataroid/build/outputs/apk/debug/Hataroid-debug.apk
            adb shell am start -n com.RetroSoft.Hataroid/.HataroidActivity
            sleep 15
            adb shell pidof com.RetroSoft.Hataroid | grep -E '^[0-9]+'
            if adb logcat -d -s AndroidRuntime:E | grep -A 12 'FATAL EXCEPTION' | grep -F 'com.RetroSoft.Hataroid'; then
              exit 1
            fi
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*/\1/p" Projects/Hataroid/build.gradle | head -1)
          test -n "$version"
          tag="android-36-v${version}-${GITHUB_SHA:0:7}"
          if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          cp Projects/Hataroid/build/outputs/apk/release/Hataroid-release.apk "Hataroid-${tag}.apk"
          gh release create "$tag" "Hataroid-${tag}.apk" --target "$GITHUB_SHA" --title "Hataroid $tag" --notes 'Signed APK for arm64-v8a, armeabi-v7a, x86_64. Bundled EmuTOS is enabled by default.'
