plugins { id 'com.android.application' }

android {
    namespace 'com.RetroSoft.Hataroid'
    lint { disable 'ExpiredTargetSdkVersion' }
    compileSdk Integer.parseInt(findProperty('androidCompileSdk') ?: '36')
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.RetroSoft.Hataroid'
        minSdk 23
        // Preserve filesystem access for the legacy disk browser.
        targetSdk 28
        versionCode 1851
        versionName '1.851'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }

    sourceSets.main {
        jniLibs.srcDir 'build/libs'
        jni.srcDirs = []
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            if (System.getenv('HATAROID_KEYSTORE')) {
                storeFile file(System.getenv('HATAROID_KEYSTORE'))
                storePassword System.getenv('HATAROID_STORE_PASSWORD')
                keyAlias System.getenv('HATAROID_KEY_ALIAS')
                keyPassword System.getenv('HATAROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('HATAROID_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
}

tasks.register('ndkBuild', Exec) {
    def ndkHome = System.getenv('ANDROID_NDK_HOME') ?: "${android.sdkDirectory}/ndk/27.2.12479018"
    workingDir projectDir
    commandLine "${ndkHome}/ndk-build", '-j4', 'NDK_PROJECT_PATH=build',
        'APP_PROJECT_PATH=src/main', 'APP_BUILD_SCRIPT=src/main/jni/Android.mk',
        'NDK_APPLICATION_MK=src/main/jni/Application.mk',
        'NDK_OUT=build/obj', 'NDK_LIBS_OUT=build/libs'
    inputs.dir 'src/main/jni'
    outputs.dir 'build/libs'
}
tasks.configureEach { if (name.startsWith('merge') && name.endsWith('JniLibFolders')) dependsOn tasks.named('ndkBuild') }

dependencies {
    implementation project(':MIDIDriver')
    implementation 'com.android.support:support-v4:28.0.0'
    implementation 'com.android.support:leanback-v17:28.0.0'
}
